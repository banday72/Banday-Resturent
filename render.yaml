services:
  - type: web
    name: restaurant-realtime
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm run start:realtime
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: REALTIME_SERVICE_KEY
        sync: false
